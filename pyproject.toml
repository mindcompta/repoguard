[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindcompta-repoguard"
version = "0.1.0"
description = "Local-first repository checks for exposed credentials and vulnerable dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["security", "secret-scanning", "osv", "dependencies", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://mindcompta.github.io/repoguard/"
Source = "https://github.com/mindcompta/repoguard"

[project.scripts]
repoguard = "repoguard.cli:main"

[tool.setuptools.packages.find]
include = ["repoguard*"]
