name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check generated demo and own working tree
        run: |
          python -m repoguard demo --format html -o "$RUNNER_TEMP/repoguard-demo.html"
          python -m repoguard scan . --format json -o "$RUNNER_TEMP/repoguard-self-scan.json"
      - name: Verify installable command
        run: |
          python -m pip install .
          repoguard --version
