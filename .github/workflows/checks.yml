name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check generated demo and own working tree
        run: |
          python -m repoguard demo --lang fr --format html -o "${{ runner.temp }}/repoguard-demo.html"
          python -m repoguard scan . --format json -o "${{ runner.temp }}/repoguard-self-scan.json"
      - name: Verify installable command
        run: |
          python -m pip install .
          repoguard --version
      - name: Verify PowerShell helper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'repoguard-fixture'
          New-Item -ItemType Directory -Path $project | Out-Null
          $publisher = 'pub-' + '1234567890123456'
          Set-Content -LiteralPath (Join-Path $project 'ads.txt') -Value $publisher -Encoding utf8
          function Start-Process { param([string]$FilePath, $ErrorAction) }
          & .\scripts\analyser-projet.ps1 -Projet $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
